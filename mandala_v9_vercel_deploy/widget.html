<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mandala">
<title>MANDALA · 지금</title>
<style>
:root{
  --bg:#0a0e14; --card:#151c26; --card2:#18202b; --line:#232e3b; --line2:#2b3644;
  --text:#f2f6fb; --muted:#93a2b6; --dim:#7f8fa3;
  --accent:#8fa4ff; --accent2:#b58cff; --good:#4fd8a4; --danger:#ff7d88;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 55% at 50% 0%,#17202c 0%,#0a0e14 58%,#080b10 100%);
  color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  min-height:100dvh;font-size:14px;-webkit-text-size-adjust:100%;
}
.wrap{max-width:480px;margin:0 auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
button{font-family:inherit}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:8px;padding:2px 2px 9px}
.dt{font-size:19px;font-weight:800;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.dt .wd{font-size:12px;font-weight:700;color:var(--muted);margin-left:3px}
.stat{margin-left:auto;font-size:12px;color:#b7c4d6;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{color:#fff;font-size:13px;font-weight:800}
.stat .dot{color:#5d6b7e;margin:0 3px}
.iconbtn{flex:none;width:34px;height:34px;border-radius:11px;border:1px solid var(--line2);
  background:#141b24;color:#cbd7e6;font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.iconbtn:active{transform:scale(.93)}
.iconbtn.busy{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.track{height:5px;background:#111823;border:1px solid #1c2531;border-radius:99px;overflow:hidden;margin:0 2px 12px}
.track i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease}

/* ---------- card ---------- */
.card{background:linear-gradient(180deg,var(--card),#121821);border:1px solid var(--line);
  border-radius:18px;padding:11px 11px 10px;margin-bottom:10px;box-shadow:0 8px 22px #0000002e}
.head{display:flex;align-items:center;gap:7px;margin:1px 1px 8px}
.label{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.chip{font-size:10.5px;font-weight:700;color:#cfdaea;background:#1d2733;border:1px solid var(--line2);
  border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- rows ---------- */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:9px;padding:7px;border-radius:12px;background:var(--card2);
  border:1px solid #0000;cursor:pointer}
.row:active{background:#1d2733}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid #3b4a5e;background:#0f151d;
  color:transparent;font-size:13px;font-weight:900;display:grid;place-items:center;padding:0;cursor:pointer}
.row.done .chk{background:#1f6b52;border-color:#2c8b6b;color:#d9fff0}
.main{min-width:0;flex:1}
.title{font-size:13.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .title{opacity:.5;text-decoration:line-through}
.sub{font-size:10.5px;color:#8fa0b5;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.xp{flex:none;font-size:10px;font-weight:800;color:var(--accent);background:#1b2433;border-radius:7px;
  padding:2px 6px;font-variant-numeric:tabular-nums}
.han{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;margin-right:6px;
  font-size:11px;font-weight:700;color:#0b0f14;background:var(--c,#8fa4ff);vertical-align:1px;
  font-family:"Noto Serif KR","HYhaeseo",serif}
.pri{display:inline-block;font-size:9.5px;font-weight:900;border-radius:6px;padding:2px 5px;margin-right:6px;
  background:#2a3444;color:#cfdaea;vertical-align:1px;letter-spacing:.02em}
.pri.TOP{background:#5a2230;color:#ffc6ce}
.pri.A{background:#4a3a1c;color:#ffd98a}
.pri.B{background:#22364a;color:#a9d3ff}
.empty{padding:13px 8px 10px;font-size:12px;color:var(--dim);text-align:center;line-height:1.65}
.empty b{color:#cfdaea;font-variant-numeric:tabular-nums}
.empty .hint{display:block;font-size:10.5px;color:#63738a;margin-top:3px}

/* ---------- mandala ---------- */
.m9{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.mc{position:relative;border-radius:12px;background:var(--card2);border:1px solid var(--line2);
  padding:7px 8px 8px;min-height:64px;overflow:hidden}
.mc .h{font-family:"Noto Serif KR","HYhaeseo",serif;font-size:17px;font-weight:700;line-height:1}
.mc .n{font-size:10px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.mc .pb{height:3px;border-radius:99px;background:#0c1218;margin-top:6px;overflow:hidden}
.mc .pb i{display:block;height:100%;width:0;background:var(--c,#8fa4ff);transition:width .3s ease}
.mc .pct{position:absolute;top:6px;right:7px;font-size:9.5px;font-weight:800;color:var(--c,#8fa4ff);
  font-variant-numeric:tabular-nums}
.mc.core{background:linear-gradient(150deg,#2b2452,#1a2233 70%);border-color:#3c3a6e;
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:9px;padding:8px 6px}
.core .cb{display:grid;grid-template-columns:1fr 1fr;gap:0;line-height:1.02;font-weight:700;
  font-family:"Noto Serif KR","HYhaeseo",serif;font-size:12px;color:#e9e4ff}
.core .rightcol{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.core .pct2{font-size:16px;font-weight:900;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.core .lbl{font-size:8.5px;color:#a49cd0;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1.1}

/* ---------- foot ---------- */
.foot{display:flex;align-items:center;gap:8px;margin:11px 3px 0;font-size:10.5px;color:#6f7f93;
  font-variant-numeric:tabular-nums}
.foot a{margin-left:auto;color:#9db0ff;text-decoration:none;font-weight:700}

/* ---------- login ---------- */
.login{padding-top:min(20vh,140px)}
.brand{font-size:11px;letter-spacing:.3em;color:var(--accent);font-weight:800;text-align:center}
.brandTitle{font-size:26px;font-weight:900;text-align:center;margin:7px 0 3px;letter-spacing:.01em}
.brandSub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px}
.field{display:block;margin-bottom:9px}
.field span{display:block;font-size:11px;color:#8fa0b5;margin-bottom:5px}
input{width:100%;background:#0f151d;border:1px solid #2b3644;border-radius:12px;padding:11px 12px;
  color:#fff;font:inherit;font-size:14px}
input:focus{outline:none;border-color:#5566a8;box-shadow:0 0 0 3px #8fa4ff22}
.primary{width:100%;margin-top:4px;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:800;
  color:#0a0e16;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.primary:disabled{opacity:.6}
.authmsg{min-height:18px;margin:10px 2px 0;font-size:11.5px;color:#ffb3ba;text-align:center;line-height:1.5}
.authmsg.ok{color:var(--good)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  opacity:0;background:#eef2ff;color:#0b1020;font-size:12px;font-weight:800;padding:8px 14px;border-radius:99px;
  transition:opacity .18s,transform .18s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<section class="wrap login" id="authView" hidden>
  <div class="brand">MANDALA LEVELUP</div>
  <div class="brandTitle">完璧超人</div>
  <div class="brandSub">오늘의 지금 · To-do · 만다라트</div>
  <form id="loginForm" autocomplete="on" novalidate>
    <label class="field"><span>이메일</span>
      <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="you@example.com">
    </label>
    <label class="field"><span>비밀번호</span>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    </label>
    <button class="primary" id="loginBtn" type="submit">로그인</button>
    <p class="authmsg" id="authMsg" aria-live="polite"></p>
  </form>
</section>

<main class="wrap" id="appView" hidden>
  <header class="top">
    <div class="dt"><span id="kDate">--/--</span><span class="wd" id="kDow"></span></div>
    <div class="stat" id="kStat">불러오는 중…</div>
    <button class="iconbtn" id="refreshBtn" type="button" aria-label="새로고침" title="새로고침">↻</button>
  </header>
  <div class="track"><i id="overallBar"></i></div>

  <section class="card">
    <div class="head">
      <span class="label" id="nowLabel">지금 할 일</span>
      <span class="chip" id="nowSlotTag">--:--</span>
      <span class="cnt" id="nowCnt"></span>
    </div>
    <ul class="list" id="nowList"></ul>
    <div class="empty" id="nowEmpty" hidden></div>
  </section>

  <section class="card">
    <div class="head">
      <span class="label">TOP TO-DO</span>
      <span class="cnt" id="todoCnt"></span>
    </div>
    <ul class="list" id="todoList"></ul>
    <div class="empty" id="todoEmpty" hidden>오늘 남은 To-do가 없습니다.</div>
  </section>

  <section class="card">
    <div class="head">
      <span class="label">만다라트</span>
      <span class="cnt" id="mOverall"></span>
    </div>
    <div class="m9" id="m9"></div>
  </section>

  <div class="foot">
    <span id="syncInfo">동기화 —</span>
    <a href="./index.html">전체 앱 →</a>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
'use strict';

/* ============ config & client ============ */
const CFG = window.MANDALA_CONFIG || {};
const configured = !!(CFG.SUPABASE_URL && CFG.SUPABASE_PUBLISHABLE_KEY &&
  !String(CFG.SUPABASE_URL).includes('YOUR_PROJECT') &&
  !String(CFG.SUPABASE_PUBLISHABLE_KEY).includes('YOUR_KEY'));

let sb = null;
if (configured) {
  try {
    sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
  } catch (e) { console.error(e); }
}

const SET_RATIOS = [0.45, 0.45, 0.40, 0.35, 0.35];
const AREA_COLORS = ['#8fa4ff', '#b58cff', '#4fd8a4', '#ffc75f', '#59c8f5', '#ff9e80', '#b9e05f', '#7ee0d5'];
const URGENCY_ORDER = { TOP: -100, A: 0, B: 1, C: 2 };
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const TZ = 'Asia/Seoul';
const DAY_FIRST = 4 * 60;          // 04:00
const DAY_LAST = 21 * 60 + 30;     // 21:30 (slot ends 22:00)

const S = {
  user: null, core: '完璧超人',
  areas: [], tasks: [], records: [], todos: [], fixed: [], entries: [], workouts: [], goalRecords: [],
  today: '', totalXp: 0, lastSync: 0, painting: false, slotKey: ''
};

const $ = (id) => document.getElementById(id);
const pad2 = (n) => String(n).padStart(2, '0');
const slice5 = (v) => v == null ? '' : String(v).slice(0, 5);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = (n) => Number(n || 0).toLocaleString('ko-KR');

/* ============ KST clock ============ */
const kstFmt = new Intl.DateTimeFormat('en-US', {
  timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
});
function kstParts(d) {
  const o = {};
  for (const p of kstFmt.formatToParts(d || new Date())) o[p.type] = p.value;
  const y = +o.year, m = +o.month, day = +o.day, hh = +o.hour, mm = +o.minute;
  return {
    y, m, d: day, hh, mm, min: hh * 60 + mm,
    date: y + '-' + pad2(m) + '-' + pad2(day),
    dow: new Date(Date.UTC(y, m - 1, day)).getUTCDay()
  };
}
const kstToday = () => kstParts().date;
function slotLabel(min) { return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }

/* ============ small helpers ============ */
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1100);
}
const dailyTasks = () => S.tasks.filter((t) => t.frequency === 'daily');
let doneSet = new Set();
const isDone = (taskId) => doneSet.has(String(taskId));

function computeTotalXp() {
  let x = 0;
  for (const r of S.records) x += Number(r.xp_earned) || 0;
  for (const g of S.goalRecords) x += Number(g.xp_earned) || 0;
  for (const t of S.todos) if (t.status === 'completed') x += Number(t.xp) || 0;
  return x;
}
function hhmm(v) {
  if (!v) return null;
  const m = String(v).slice(0, 5).split(':');
  const h = Number(m[0]), mm = Number(m[1]);
  if (!Number.isFinite(h) || !Number.isFinite(mm)) return null;
  return h * 60 + mm;
}
function calcSets(maxValue) {
  const n = Number(maxValue);
  if (!Number.isFinite(n) || n < 0) return [];
  return SET_RATIOS.map((r) => Math.round(n * r));
}

/* ============ workout matching ============ */
function normName(v) {
  return String(v == null ? '' : v).toLowerCase()
    .replace(/\([^)]*\)|\[[^\]]*\]/g, '')
    .replace(/[\s·・,.\-_/+]/g, '');
}
function workoutsForTask(task) {
  const n = normName(task && task.name);
  if (n.length < 2) return [];
  const out = [];
  for (const w of S.workouts) {
    const m = normName(w.name);
    if (m.length < 2) continue;
    if (m === n || m.includes(n) || n.includes(m)) out.push(w);
    if (out.length >= 2) break;
  }
  return out;
}

/* ============ slot composition ============ */
function todoCoversSlot(t, slotMin) {
  if (!t || !t.due_at) return false;
  const d = new Date(t.due_at);
  if (Number.isNaN(d.getTime())) return false;
  const p = kstParts(d);
  if (p.date !== S.today) return false;
  const dur = Number(t.duration_minutes) > 0 ? Number(t.duration_minutes) : 30;
  return slotMin >= p.min && slotMin < p.min + dur;
}

function slotItems(slotMin) {
  const slot = slotLabel(slotMin);
  const entry = S.entries.find((e) => slice5(e.slot_time) === slot) || null;
  const fixed = S.fixed.find((f) => slice5(f.slot_time) === slot) || null;
  const snapIds = entry && Array.isArray(entry.task_ids) ? entry.task_ids : [];
  const baseIds = (snapIds.length ? snapIds : (fixed && Array.isArray(fixed.task_ids) ? fixed.task_ids : [])).map(String);

  const seenT = new Set();
  const tasks = [];
  for (const id of baseIds) {
    if (seenT.has(id)) continue;
    seenT.add(id);
    const t = S.tasks.find((x) => String(x.id) === id);
    if (t) tasks.push(t);
  }

  const todoIds = new Set(((entry && entry.todo_ids) || []).map(String));
  const seenD = new Set();
  const todos = S.todos.filter((t) => {
    if (t.active === false) return false;
    if (t.todo_date !== S.today) return false;
    if (['cancelled', 'postponed'].includes(t.status || 'pending')) return false;
    const byId = todoIds.has(String(t.id));
    if (!byId && !todoCoversSlot(t, slotMin)) return false;
    if (seenD.has(String(t.id))) return false;
    seenD.add(String(t.id));
    return true;
  });

  return { slot, tasks, todos, entry };
}

/* ============ data load ============ */
let inFlight = false;
async function refresh(manual) {
  if (!sb || !S.user || inFlight) return;
  inFlight = true;
  const btn = $('refreshBtn');
  if (manual && btn) btn.classList.add('busy');
  try {
    const uid = S.user.id;
    const today = kstToday();
    const res = await Promise.all([
      sb.from('app_settings').select('core_goal').eq('user_id', uid).maybeSingle(),
      sb.from('mandala_areas').select('id,name,sort_order,active').eq('user_id', uid).eq('active', true).order('sort_order'),
      sb.from('tasks').select('id,name,area_id,frequency,xp,start_time,end_time,time_slot,active').eq('user_id', uid).eq('active', true),
      sb.from('task_records').select('id,task_id,completed_date,xp_earned').eq('user_id', uid).order('completed_date', { ascending: false }).limit(30000),
      sb.from('daily_todos').select('id,title,status,urgency,xp,todo_date,active,due_at,duration_minutes,created_at').eq('user_id', uid).order('todo_date', { ascending: false }).limit(20000),
      sb.from('timetable_fixed').select('slot_time,task_ids').eq('user_id', uid),
      sb.from('timetable_entries').select('slot_time,task_ids,todo_ids,detail_text,extra_text').eq('user_id', uid).eq('entry_date', today),
      sb.from('workout_routines').select('name,max_value').eq('user_id', uid).eq('active', true).order('sort_order'),
      sb.from('goal_records').select('xp_earned').eq('user_id', uid).limit(20000)
    ]);

    const failed = res.find((r) => r && r.error);
    if (failed) throw failed.error;

    S.core = (res[0].data && res[0].data.core_goal) || '完璧超人';
    S.areas = res[1].data || [];
    S.tasks = res[2].data || [];
    S.records = res[3].data || [];
    S.todos = res[4].data || [];
    S.fixed = res[5].data || [];
    S.entries = res[6].data || [];
    S.workouts = res[7].data || [];
    S.goalRecords = res[8].data || [];
    S.today = today;
    S.totalXp = computeTotalXp();
    S.lastSync = Date.now();
    paint();
  } catch (e) {
    console.error(e);
    const st = $('kStat');
    if (st && !S.today) st.textContent = '불러오기 실패';
    toast('불러오기 실패');
  } finally {
    inFlight = false;
    if (btn) btn.classList.remove('busy');
  }
}

/* ============ paint ============ */
function paint() {
  if (!S.today) return;
  doneSet = new Set(S.records.filter((r) => r.completed_date === S.today).map((r) => String(r.task_id)));
  renderTop();
  renderNow();
  renderTodos();
  renderMandala();
  renderFoot();
}

function renderTop() {
  const n = kstParts();
  $('kDate').textContent = pad2(n.m) + '/' + pad2(n.d);
  $('kDow').textContent = '(' + WEEK[n.dow] + ')';
  const daily = dailyTasks();
  const done = daily.filter((t) => isDone(t.id)).length;
  $('kStat').innerHTML = '<b>' + done + '/' + daily.length + '</b><span class="dot">·</span><b>' +
    fmtNum(S.totalXp) + ' XP</b>';
  $('overallBar').style.width = (daily.length ? Math.round(done / daily.length * 100) : 0) + '%';
}

function areaOf(t) { return S.areas.find((a) => a.id === t.area_id) || null; }
function areaColor(a) {
  const i = a ? S.areas.indexOf(a) : -1;
  return AREA_COLORS[(i < 0 ? 0 : i) % AREA_COLORS.length];
}

function makeCheck(done) {
  return '<button class="chk" type="button" role="checkbox" aria-checked="' + (done ? 'true' : 'false') +
    '" aria-label="완료"><span>✓</span></button>';
}

function taskRow(t) {
  const done = isDone(t.id);
  const a = areaOf(t);
  const ws = workoutsForTask(t);
  const subs = [];
  for (const w of ws) {
    const sets = calcSets(w.max_value);
    if (!sets.length) continue;
    const total = sets.reduce((x, y) => x + y, 0);
    const nm = normName(w.name).length ? String(w.name).replace(/^\([^)]*\)\s*/, '') : w.name;
    subs.push(esc(nm) + ' ' + sets.join('·') + ' (총 ' + total + ')');
  }
  const li = document.createElement('li');
  li.className = 'row' + (done ? ' done' : '');
  li.dataset.kind = 'task';
  li.dataset.id = t.id;
  li.innerHTML = makeCheck(done) +
    '<div class="main"><div class="title">' +
    (a ? '<span class="han" style="--c:' + areaColor(a) + '">' + esc(a.name) + '</span>' : '') +
    esc(t.name) + '</div>' +
    (subs.length ? '<div class="sub">' + subs.join('  /  ') + '</div>' : '') +
    '</div><span class="xp">+' + (Number(t.xp) || 0) + '</span>';
  li.addEventListener('click', (ev) => {
    ev.preventDefault();
    toggleTask(t);
  });
  return li;
}

function dueLabel(t) {
  if (!t.due_at) return '';
  const d = new Date(t.due_at);
  if (Number.isNaN(d.getTime())) return '';
  const p = kstParts(d);
  const time = slotLabel(p.min);
  if (p.date === S.today) return '오늘 ' + time;
  const base = new Date(Date.UTC(kstParts().y, kstParts().m - 1, kstParts().d));
  const target = new Date(Date.UTC(p.y, p.m - 1, p.d));
  const dd = Math.round((target - base) / 86400000);
  const stamp = pad2(p.m) + '/' + pad2(p.d) + ' ' + time;
  if (dd === 1) return '내일 ' + time;
  if (dd === -1) return '어제 ' + stamp;
  if (dd > 1) return 'D-' + dd + ' · ' + stamp;
  return stamp;
}

function todoRow(t, withPri) {
  const done = (t.status || 'pending') === 'completed';
  const pri = withPri ? (t.urgency || '') : '';
  const due = dueLabel(t);
  const li = document.createElement('li');
  li.className = 'row' + (done ? ' done' : '');
  li.dataset.kind = 'todo';
  li.dataset.id = t.id;
  li.innerHTML = makeCheck(done) +
    '<div class="main"><div class="title">' +
    (pri ? '<span class="pri ' + esc(pri) + '">' + esc(pri) + '</span>' : '') +
    esc(t.title) + '</div>' +
    (due ? '<div class="sub">' + esc(due) + '</div>' : '') +
    '</div><span class="xp">+' + (Number(t.xp) || 0) + '</span>';
  li.addEventListener('click', (ev) => {
    ev.preventDefault();
    toggleTodo(t);
  });
  return li;
}

function renderNow() {
  const n = kstParts();
  const list = $('nowList'), empty = $('nowEmpty');
  list.innerHTML = '';
  let label = '지금 할 일', chip = '', items = null, mode = 'now', slotMin = null;

  if (n.min < DAY_FIRST) {
    mode = 'before'; slotMin = DAY_FIRST; label = '다음 할 일';
    chip = slotLabel(slotMin) + '–' + slotLabel(slotMin + 30);
  } else if (n.min >= DAY_LAST + 30) {
    mode = 'after'; label = '오늘 마무리'; chip = '21:30 종료';
  } else {
    slotMin = Math.floor(n.min / 30) * 30;
    chip = slotLabel(slotMin) + '–' + slotLabel(slotMin + 30);
  }
  $('nowLabel').textContent = label;
  $('nowSlotTag').textContent = chip;

  if (mode === 'after') {
    const daily = dailyTasks();
    const done = daily.filter((t) => isDone(t.id)).length;
    const leftTodos = S.todos.filter((t) => t.active !== false && t.todo_date === S.today &&
      ['pending', 'in_progress'].includes(t.status || 'pending')).length;
    $('nowCnt').textContent = done + '/' + daily.length;
    list.hidden = true;
    empty.hidden = false;
    const nx = nextFixedSlot(n.min);
    empty.innerHTML = '오늘 완료 <b>' + done + '/' + daily.length + '</b> · 남은 과업 <b>' + Math.max(0, daily.length - done) + '</b>' +
      (leftTodos ? ' · 남은 To-do <b>' + leftTodos + '</b>' : '') +
      '<span class="hint">다음 슬롯 ' + (nx != null ? slotLabel(nx) : '04:00') + ' (내일)</span>';
    S.slotKey = 'after';
    return;
  }

  list.hidden = false;
  empty.hidden = true;
  items = slotItems(slotMin);

  const total = items.tasks.length + items.todos.length;
  $('nowCnt').textContent = total ? total + '개' : '';

  for (const t of items.tasks) list.appendChild(taskRow(t));
  for (const t of items.todos) list.appendChild(todoRow(t, true));

  if (!total) {
    const nx = nextFixedSlot(n.min);
    list.hidden = true;
    empty.hidden = false;
    empty.innerHTML = (mode === 'before' ? '아직 04:00 전입니다.' : '이 시간대에 배정된 과업이 없습니다.') +
      '<span class="hint">' + (nx != null ? '다음 슬롯 ' + slotLabel(nx) : '다음 슬롯 04:00 (내일)') + '</span>';
  }
  S.slotKey = mode + ':' + slotMin;
}

function nextFixedSlot(min) {
  const mins = S.fixed.map((f) => hhmm(f.slot_time)).filter((v) => v != null).sort((a, b) => a - b);
  const hit = mins.find((v) => v > min);
  return hit == null ? null : hit;
}

function renderTodos() {
  const list = $('todoList'), empty = $('todoEmpty');
  const todayAll = S.todos.filter((t) => t.active !== false && t.todo_date === S.today);
  const doneCnt = todayAll.filter((t) => (t.status || '') === 'completed').length;
  $('todoCnt').textContent = todayAll.length ? doneCnt + '/' + todayAll.length : '';

  const open = todayAll.filter((t) => ['pending', 'in_progress'].includes(t.status || 'pending'));
  open.sort((a, b) => {
    const ua = URGENCY_ORDER[a.urgency || ''] != null ? URGENCY_ORDER[a.urgency || ''] : 9;
    const ub = URGENCY_ORDER[b.urgency || ''] != null ? URGENCY_ORDER[b.urgency || ''] : 9;
    if (ua !== ub) return ua - ub;
    const da = a.due_at ? new Date(a.due_at).getTime() : Number.MAX_SAFE_INTEGER;
    const db = b.due_at ? new Date(b.due_at).getTime() : Number.MAX_SAFE_INTEGER;
    if (da !== db) return da - db;
    return String(a.created_at || '').localeCompare(String(b.created_at || ''));
  });

  const shown = open.slice(0, 5);
  list.innerHTML = '';
  for (const t of shown) list.appendChild(todoRow(t, true));
  list.hidden = shown.length === 0;
  empty.hidden = shown.length > 0;
  if (open.length > shown.length) {
    $('todoCnt').textContent = doneCnt + '/' + todayAll.length + ' · +' + (open.length - shown.length);
  }
}

function renderMandala() {
  const daily = dailyTasks();
  const doneAll = daily.filter((t) => isDone(t.id)).length;
  const pctAll = daily.length ? Math.round(doneAll / daily.length * 100) : 0;
  $('mOverall').textContent = pctAll + '% · ' + doneAll + '/' + daily.length;

  const grid = $('m9');
  grid.innerHTML = '';
  const areas = S.areas.slice(0, 8);
  let ai = 0;
  for (let i = 0; i < 9; i++) {
    if (i === 4) { grid.appendChild(coreCell(pctAll, doneAll, daily.length)); continue; }
    const a = areas[ai];
    grid.appendChild(areaCell(a, ai, daily));
    ai++;
  }
}

function coreCell(pct, done, total) {
  const el = document.createElement('div');
  el.className = 'mc core';
  const chars = String(S.core || '完璧超人').replace(/\s/g, '').slice(0, 4);
  let cb = '';
  for (let i = 0; i < 4; i++) cb += '<span>' + esc(chars[i] || '') + '</span>';
  el.innerHTML = '<div class="cb">' + cb + '</div><div class="rightcol"><div class="pct2">' + pct + '%</div>' +
    '<div class="lbl">' + done + '/' + total + '</div></div>';
  el.title = S.core + ' · 오늘 ' + pct + '%';
  return el;
}

function areaCell(a, index, daily) {
  const el = document.createElement('div');
  if (!a) { el.className = 'mc'; return el; }
  const list = daily.filter((t) => t.area_id === a.id);
  const done = list.filter((t) => isDone(t.id)).length;
  const pct = list.length ? Math.round(done / list.length * 100) : 0;
  el.className = 'mc';
  el.style.setProperty('--c', AREA_COLORS[index % AREA_COLORS.length]);
  el.innerHTML = '<span class="pct">' + (list.length ? pct + '%' : '—') + '</span>' +
    '<div class="h">' + esc(a.name) + '</div>' +
    '<div class="n">' + done + '/' + list.length + '</div>' +
    '<div class="pb"><i style="width:' + pct + '%"></i></div>';
  el.title = a.name + ' · ' + done + '/' + list.length;
  return el;
}

function renderFoot() {
  if (!S.lastSync) return;
  const d = new Date(S.lastSync);
  const p = kstParts(d);
  $('syncInfo').textContent = '동기화 ' + pad2(p.m) + '/' + pad2(p.d) + ' ' + slotLabel(p.min);
}

/* ============ writes ============ */
const pending = new Set();

async function toggleTask(t) {
  if (!sb || !S.user) return;
  const key = 't:' + t.id;
  if (pending.has(key)) return;
  pending.add(key);
  const today = S.today || kstToday();
  const xp = Number(t.xp) || 0;
  const existing = S.records.find((r) => String(r.task_id) === String(t.id) && r.completed_date === today);
  let tmp = null;
  try {
    if (existing) {
      S.records = S.records.filter((r) => r !== existing);
      S.totalXp = Math.max(0, S.totalXp - (Number(existing.xp_earned) || 0));
      paint(); toast('−' + xp + ' XP');
      const { error } = await sb.from('task_records').delete().eq('id', existing.id);
      if (error) throw error;
    } else {
      tmp = { id: 'tmp-' + Date.now(), task_id: t.id, completed_date: today, xp_earned: xp };
      S.records = [tmp].concat(S.records);
      S.totalXp += xp;
      paint(); toast('+' + xp + ' XP');
      const { data, error } = await sb.from('task_records')
        .insert({ user_id: S.user.id, task_id: t.id, completed_date: today, xp_earned: xp })
        .select('id,task_id,completed_date,xp_earned').single();
      if (error) throw error;
      S.records = S.records.map((r) => (r === tmp ? data : r));
    }
    paint();
  } catch (e) {
    console.error(e);
    if (existing) S.records = [existing].concat(S.records);
    else if (tmp) S.records = S.records.filter((r) => r !== tmp);
    S.totalXp = computeTotalXp();
    paint();
    toast('저장 실패');
  } finally {
    pending.delete(key);
  }
}

async function toggleTodo(t) {
  if (!sb || !S.user) return;
  const key = 'd:' + t.id;
  if (pending.has(key)) return;
  pending.add(key);
  const before = { status: t.status, todo_date: t.todo_date };
  const next = (t.status || 'pending') === 'completed' ? 'pending' : 'completed';
  const xp = Number(t.xp) || 0;
  try {
    t.status = next;
    S.totalXp = Math.max(0, S.totalXp + (next === 'completed' ? xp : -xp));
    paint();
    toast((next === 'completed' ? '+' : '−') + xp + ' XP');
    const payload = { status: next, updated_at: new Date().toISOString() };
    if (next === 'completed') payload.todo_date = S.today;
    const { data, error } = await sb.from('daily_todos').update(payload).eq('id', t.id)
      .select('id,status,todo_date').single();
    if (error) throw error;
    t.status = data.status;
    t.todo_date = data.todo_date;
    paint();
  } catch (e) {
    console.error(e);
    t.status = before.status;
    t.todo_date = before.todo_date;
    S.totalXp = computeTotalXp();
    paint();
    toast('저장 실패');
  } finally {
    pending.delete(key);
  }
}

/* ============ views ============ */
function showAuth(msg, disable) {
  $('authView').hidden = false;
  $('appView').hidden = true;
  if (msg) {
    const el = $('authMsg');
    el.textContent = msg;
    el.classList.remove('ok');
  }
  if (disable) $('loginBtn').disabled = true;
}
function showApp() {
  $('authView').hidden = true;
  $('appView').hidden = false;
}

$('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!sb) { showAuth('config.js의 Supabase 설정을 확인하세요.', true); return; }
  const emailEl = $('email'), passEl = $('password'), btn = $('loginBtn'), msg = $('authMsg');
  const email = emailEl.value.trim(), password = passEl.value;
  if (!email || !password) { msg.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
  btn.disabled = true; btn.textContent = '로그인 중…'; msg.textContent = '';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (!data.session) throw new Error('세션을 받지 못했습니다.');
    S.user = data.session.user;
    passEl.value = '';
    msg.textContent = '로그인 완료'; msg.classList.add('ok');
    showApp();
    await refresh(true);
  } catch (e) {
    const m = String((e && e.message) || '');
    msg.textContent = /invalid/i.test(m) ? '이메일 또는 비밀번호가 맞지 않습니다.' : (m || '로그인 실패');
  } finally {
    btn.disabled = false; btn.textContent = '로그인';
  }
});

$('refreshBtn').addEventListener('click', () => refresh(true));

/* ============ boot ============ */
async function boot() {
  if (!configured || !sb) {
    showAuth('config.js의 Supabase 설정(SUPABASE_URL / PUBLISHABLE_KEY)을 확인하세요.', true);
    return;
  }
  let session = null;
  try {
    const r = await sb.auth.getSession();
    session = r && r.data ? r.data.session : null;
  } catch (e) { console.error(e); }
  if (!session) { showAuth(); return; }
  S.user = session.user;
  showApp();
  await refresh(false);
}

boot();

/* keep the clock and the now-slot current */
let lastTickKey = '';
function tick() {
  if (!S.today || document.visibilityState !== 'visible') return;
  const n = kstParts();
  if (n.date !== S.today) { refresh(false); return; }
  const key = (n.min < DAY_FIRST ? 'before' : (n.min >= DAY_LAST + 30 ? 'after' : String(Math.floor(n.min / 30) * 30)));
  if (key !== lastTickKey) {
    lastTickKey = key;
    if (key !== S.slotKey) { paint(); return; }
  }
  renderTop();
}
setInterval(tick, 15000);

setInterval(() => {
  if (document.visibilityState === 'visible') refresh(false);
}, 60000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh(true);
});
</script>
